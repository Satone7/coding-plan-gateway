# Docker Compose for E2E Testing Environment
# Uses production config.yaml but isolated data volumes for testing
# This ensures tests use real configuration while keeping test data separate from production

services:
  # Local LiteLLM as an Anthropic<->OpenAI converter for the NVIDIA via-LiteLLM
  # scenario. Claude Code (Anthropic) -> gateway -> litellm -> NVIDIA (OpenAI).
  # Self-contained so the E2E env doesn't depend on the router's production
  # LiteLLM (which has no host port mapping and is unreachable from here).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-e2e
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      # REQUIRED: makes /v1/messages use the chat/completions path instead of
      # the Responses API (which NVIDIA does not serve).
      - LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES=true
    volumes:
      - ./e2e/litellm-config.yaml:/app/config.yaml:ro
    command: --config /app/config.yaml --port 4000
    networks:
      - e2e-network
    healthcheck:
      # LiteLLM image has no wget/curl; use python3 (always present).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  gateway:
    image: coding-plan-gateway:test
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gateway-e2e
    ports:
      - "${E2E_GATEWAY_PORT:-8081}:8080"
    env_file:
      - ./.env
    environment:
      - ENCRYPTION_KEY=${E2E_ENCRYPTION_KEY}
      - LOG_LEVEL=debug
      - GATEWAY_URL=http://gateway-e2e:8080
      - CONFIG_PATH=/app/config.yaml
      - API_KEYS_PATH=/app/data/api-keys.json
      - USAGE_DATA_PATH=/app/data/usage-data.json
      - PLAN_USAGE_DATA_PATH=/app/data/plan-usage-data.json
    volumes:
      - ./e2e/test-config.yaml:/app/config.yaml:ro
      - e2e-api-keys:/app/data
      - e2e-logs:/app/logs
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  claude-code:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: claude-code-e2e
    user: "1000:1000"
    environment:
      - ANTHROPIC_BASE_URL=http://gateway-e2e:8080/api
      - ANTHROPIC_MODEL=${E2E_DEFAULT_MODEL:-ark-code-latest}
      - ANTHROPIC_API_KEY=dummy-key-for-gateway
      - HOME=/home/claude
    volumes:
      - ./e2e/claude-home/.claude:/home/claude/.claude
      - ./e2e/claude-home/.claude.json:/home/claude/.claude.json
      - ./e2e/workspace:/workspace
    networks:
      - e2e-network
    depends_on:
      gateway:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  e2e-network:
    driver: bridge

volumes:
  e2e-api-keys:
  e2e-logs:
