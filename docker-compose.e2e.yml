# Docker Compose for E2E Testing Environment
# Uses production config.yaml but isolated data volumes for testing
# This ensures tests use real configuration while keeping test data separate from production

services:
  gateway:
    image: coding-plan-gateway:test
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gateway-e2e
    ports:
      - "8081:8080"  # Different port to avoid conflict with production
    environment:
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - LOG_LEVEL=debug
      - GATEWAY_URL=http://localhost:8080
    volumes:
      # Use test config (read-write for onboard command)
      - ./e2e/test-config.yaml:/app/config.yaml
      # Isolated data volumes for testing (won't pollute production)
      - e2e-api-keys:/app/data
      - e2e-logs:/app/logs
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  claude-code:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: claude-code-e2e
    environment:
      - ANTHROPIC_BASE_URL=http://gateway-e2e:8080
      - ANTHROPIC_MODEL=kimi-k2.5
      - ANTHROPIC_API_KEY=cpg_Qnhp8ZikLlKutijYis0R78n8HP0roxgk
    volumes:
      - e2e-claude-logs:/home/claude/.claude/logs
      - ./e2e/workspace:/workspace
    networks:
      - e2e-network
    depends_on:
      gateway:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  e2e-network:
    driver: bridge

volumes:
  # Named volumes for test data isolation
  e2e-api-keys:
  e2e-logs:
  e2e-claude-logs: