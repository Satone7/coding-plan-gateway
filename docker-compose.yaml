services:
  gateway:
    image: coding-plan-gateway:latest
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    container_name: coding-plan-gateway
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=Asia/Shanghai
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - CONFIG_PATH=/app/config.yaml
      - QUOTA_STATE_PATH=/app/data/quota-state.json
      - QUOTA_SYNC_INTERVAL=${QUOTA_SYNC_INTERVAL:-60000}
      - API_KEYS_PATH=/app/data/api-keys.json
      - USAGE_DATA_PATH=/app/data/usage-data.json
      - USAGE_SYNC_INTERVAL=${USAGE_SYNC_INTERVAL:-60000}
      - ENABLE_AUTH=${ENABLE_AUTH:-true}
      - PLAN_USAGE_DATA_PATH=/app/data/plan-usage-data.json
      - GATEWAY_URL=http://localhost:${PORT:-8080}
      - IPC_SOCKET_PATH=/app/data/coding-plan-gateway.sock
    volumes:
      # Persist configuration - mount config.yaml to container root
      - ./config.yaml:/app/config.yaml
      # Persist quota state and IPC socket
      - gateway-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - gateway-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Development service with hot reload
  gateway-dev:
    image: coding-plan-gateway-dev:latest
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.dev
      pull: false
    container_name: coding-plan-gateway-dev
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - LOG_LEVEL=debug
      - TZ=Asia/Shanghai
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - IPC_SOCKET_PATH=/app/data/coding-plan-gateway.sock
    volumes:
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml
      - gateway-data:/app/data
    restart: unless-stopped
    networks:
      - gateway-network
    profiles:
      - dev

volumes:
  gateway-data:
    driver: local

networks:
  gateway-network:
    driver: bridge